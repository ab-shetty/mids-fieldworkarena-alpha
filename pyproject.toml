[project]
name = "purple-agent-fwa"
version = "0.1.0"
description = "Purple agent for the FieldWorkArena AgentBeats benchmark (gpt-5-mini, multimodal)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
    "a2a-sdk[http-server]>=0.3.20,<1.0",
    "openai>=2.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "uvicorn>=0.38.0",
    "python-dotenv>=1.1.1",
    "pypdf>=6.4.0",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
